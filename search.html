<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search &mdash; Hubbell Civil War Letters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="logo.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="_design.css">
<link rel="stylesheet" href="_overlay.css">
<style>
/* ===== SEARCH PAGE ===== */
.search-page{max-width:900px;margin:0 auto;padding:72px 32px 60px}
.search-header{margin-bottom:20px}
.search-header h1{margin-bottom:4px}
.search-page-input-wrap{margin:12px 0 8px}
.search-page-input{width:100%;padding:12px 16px;border:1px solid var(--rule-2);border-radius:8px;background:var(--bg-sunken);color:var(--ink);font-family:var(--font-serif);font-size:1rem;outline:none;transition:border-color 0.2s,box-shadow 0.2s}
.search-page-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-page-input::placeholder{color:var(--ink-4)}
.search-header .result-count{font-size:0.85rem;color:var(--ink-2)}

/* Controls bar */
.search-controls{display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.sort-select{padding:5px 10px;border:1px solid var(--rule);border-radius:4px;background:var(--bg-elev);font-family:var(--font-sans);font-size:0.78rem;color:var(--ink);cursor:pointer}
.sort-select:focus{outline:none;border-color:var(--ink-3)}

/* Filter chips */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.filter-chip{font-size:0.72rem;padding:4px 12px;border-radius:16px;border:1px solid var(--rule);background:var(--bg-elev);cursor:pointer;transition:all 0.15s;font-family:var(--font-sans);font-weight:500;user-select:none;display:inline-flex;align-items:center;gap:4px}
.filter-chip:hover{border-color:var(--ink-3)}
.filter-chip.active{background:var(--ink);color:white;border-color:var(--ink)}
.filter-chip .chip-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.filter-chip.active .chip-dot{box-shadow:0 0 0 1px rgba(255,255,255,0.5)}
.filter-sep{width:1px;height:20px;background:var(--rule);margin:0 4px;flex-shrink:0}
.filter-chip.flag-chip.active{background:#F5F0EB;color:var(--ink);border-color:var(--ink-2)}
.filter-chip.sig-chip.active{background:#FFF8E1;color:#8D6E00;border-color:#C9A600}

/* Results list */
.results-list{display:flex;flex-direction:column;gap:1px}
.result-card{background:var(--bg-elev);border:1px solid var(--rule);border-radius:4px;padding:16px 20px;cursor:pointer;transition:transform 0.1s,box-shadow 0.1s;display:flex;gap:12px;align-items:flex-start}
.result-card:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.rc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:5px}
.rc-body{flex:1;min-width:0}
.rc-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.rc-author{font-weight:600;font-size:0.88rem}
.rc-date{font-size:0.78rem;color:var(--ink-2)}
.rc-location{font-size:0.75rem;color:var(--ink-3)}
.rc-recipient{font-size:0.78rem;color:var(--ink-2);margin-bottom:6px}
.rc-excerpt{font-family:var(--font-serif);font-size:0.88rem;color:var(--ink-2);line-height:1.65;margin-bottom:6px}
.rc-excerpt mark{background:rgba(255,200,50,0.35);color:inherit;font-weight:500;border-radius:2px;padding:0 1px}
.rc-footer{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.rc-badge{font-size:0.62rem;padding:1px 6px;border-radius:8px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
.rc-badge.text{background:#F5F5F5;color:#616161}
.rc-badge.person{background:#E3F2FD;color:#1565C0}
.rc-badge.place{background:#E8F5E9;color:#2E7D32}
.rc-badge.meta{background:#FFF3E0;color:#E65100}
.rc-badge.battle{background:#FCE4EC;color:#C62828}
.rc-badge.illness{background:#FFF3E0;color:#E65100}
.rc-badge.death{background:#EFEBE9;color:#4E342E}
.rc-badge.wound{background:#F3E5F5;color:#7B1FA2}
.rc-sig{color:#C9A600;font-size:0.72rem;margin-left:4px}
.rc-people{font-size:0.7rem;color:var(--ink-3);margin-left:auto}
.rc-map-link{font-size:0.68rem;color:#2D5F8A;text-decoration:none;display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;background:#E3F2FD;font-weight:500;transition:background 0.15s}
.rc-map-link:hover{background:#BBDEFB}
.reader-map-link{font-size:0.78rem;color:#2D5F8A;text-decoration:none;display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:10px;background:#E3F2FD;font-weight:500;margin-left:8px;transition:background 0.15s}
.reader-map-link:hover{background:#BBDEFB}

/* Load more */
.load-more{display:block;width:100%;padding:12px;margin-top:16px;border:1px solid var(--rule);border-radius:4px;background:var(--bg-elev);font-family:var(--font-sans);font-size:0.85rem;color:var(--ink-2);cursor:pointer;text-align:center;transition:background 0.15s}
.load-more:hover{background:var(--rule-2)}

/* Hover tooltip */
.search-tooltip{position:fixed;z-index:10001;pointer-events:none;opacity:0;transition:opacity 0.15s;max-width:340px;padding:12px 14px;background:var(--bg-elev,#fff);border:1px solid var(--rule,#e0e0e0);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.12)}
.search-tooltip.visible{opacity:1}
.search-tooltip .stt-author{font-size:0.74rem;font-weight:600;margin-bottom:2px}
.search-tooltip .stt-date{font-size:0.68rem;color:var(--ink-2);margin-bottom:6px}
.search-tooltip .stt-summary{font-size:0.78rem;color:var(--ink);line-height:1.5;font-style:italic}
.search-tooltip .stt-tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.search-tooltip .stt-tag{font-family:var(--font-sans,Inter,system-ui,sans-serif);font-size:0.6rem;font-weight:600;padding:1px 6px;border-radius:999px;text-transform:uppercase;letter-spacing:0.02em}
.search-tooltip .stt-battle{background:#FDE8E8;color:#9B2C2C}
.search-tooltip .stt-illness{background:#FEFCBF;color:#975A16}
.search-tooltip .stt-death{background:#EDF2F7;color:#4A5568}
.search-tooltip .stt-wound{background:#FAF5FF;color:#6B46C1}

/* Empty state */
.search-empty{text-align:center;padding:60px 20px;color:var(--ink-3)}
.search-empty h2{font-family:var(--font-display);font-size:1.2rem;margin-bottom:8px;color:var(--ink-2)}
.search-empty p{font-size:0.9rem}

/* ===== LETTER READER PANEL ===== */
.reader-overlay{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;padding:24px}
.reader-overlay.open{display:flex}
.reader-panel{background:var(--bg-elev);border-radius:4px;max-width:875px;width:100%;height:88vh;padding:0;position:relative;border:1px solid var(--rule);display:flex;flex-direction:column}
#hubbellReaderContent{flex:1;overflow-y:auto;padding:0 36px 28px}
.reader-header{min-height:70px;padding-top:28px}
.reader-nav-bar{padding:10px 36px 12px;flex-shrink:0}
.reader-close{position:absolute;top:12px;right:14px;border:none;background:none;font-size:1.5rem;cursor:pointer;color:var(--ink-3);line-height:1}
.reader-close:hover{color:var(--ink)}
.reader-header h3{font-family:var(--font-display);font-size:1.2rem;margin-bottom:4px}
.reader-meta{font-size:0.75rem;color:var(--ink-2);margin-bottom:8px;line-height:1.5}
.reader-meta .rm-id{font-size:0.7rem;color:var(--ink-3)}
.reader-flags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.reader-flag{font-size:0.65rem;padding:2px 8px;border-radius:8px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
.rf-battle{background:#FCE4EC;color:#C62828}
.rf-illness{background:#FFF3E0;color:#E65100}
.rf-death{background:#EFEBE9;color:#4E342E}
.rf-wound{background:#F3E5F5;color:#7B1FA2}
.reader-people,.reader-places{margin-bottom:6px}
.reader-people h4,.reader-places h4{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.8px;color:var(--ink-3);font-family:var(--font-sans);font-weight:600;margin-bottom:3px}
.reader-tags{display:flex;gap:4px;flex-wrap:wrap}
.reader-tag{font-size:0.73rem;padding:2px 8px;border-radius:10px;background:var(--rule-2);color:var(--ink-2)}
.reader-tag.person{background:#E3F2FD;color:#1565C0}
.reader-tag.place{background:#E8F5E9;color:#2E7D32}
.reader-body{font-family:var(--font-serif);font-size:0.92rem;line-height:1.85;color:var(--ink);background:var(--bg);border-radius:4px;padding:20px 22px;white-space:pre-wrap;border:1px solid var(--rule-2);max-height:520px;overflow-y:auto}
.reader-meta .rm-date{font-weight:600;color:var(--ink)}
.reader-meta .rm-loc{font-weight:500;color:var(--ink-2);font-style:italic}
.reader-body mark{background:rgba(255,200,50,0.35);color:inherit;font-weight:500;border-radius:2px;padding:0 1px}

/* ===== SEARCH DROPDOWN (nav preview) ===== */
.search-dropdown{position:absolute;top:calc(100% + 6px);right:0;width:520px;max-height:70vh;overflow-y:auto;background:var(--bg-elev);border:1px solid var(--rule);border-radius:4px;box-shadow:0 12px 40px rgba(0,0,0,0.15);display:none;z-index:9999;font-size:0.83rem}
.search-dropdown.open{display:block}
.search-summary{padding:10px 16px;border-bottom:1px solid var(--rule-2);font-size:0.74rem;color:var(--ink-3);display:flex;gap:12px;flex-wrap:wrap}
.search-summary .author-count{display:inline-flex;align-items:center;gap:4px}
.search-summary .author-count .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.search-group{padding:6px 0}
.search-group-label{padding:4px 16px;font-size:0.68rem;text-transform:uppercase;letter-spacing:1px;color:var(--ink-3);font-weight:600;background:var(--bg)}
.search-result{padding:10px 16px;cursor:pointer;transition:background 0.1s;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--rule-2)}
.search-result:last-child{border-bottom:none}
.search-result:hover{background:var(--rule-2)}
.sr-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.sr-body{flex:1;min-width:0}
.sr-meta{font-size:0.72rem;color:var(--ink-3);margin-bottom:2px}
.sr-meta strong{color:var(--ink-2);font-weight:500}
.sr-excerpt{font-family:var(--font-serif);font-size:0.82rem;color:var(--ink-2);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sr-excerpt mark{background:rgba(255,200,50,0.35);color:inherit;font-weight:500;border-radius:2px;padding:0 1px}
.sr-badges{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.sr-badge{font-size:0.62rem;padding:1px 6px;border-radius:8px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
.sr-badge.text{background:#F5F5F5;color:#616161}
.sr-badge.person{background:#E3F2FD;color:#1565C0}
.sr-badge.place{background:#E8F5E9;color:#2E7D32}
.sr-badge.meta{background:#FFF3E0;color:#E65100}
.search-empty{padding:20px 16px;text-align:center;color:var(--ink-3);font-style:italic}

@media(max-width:700px){
  .search-dropdown{width:calc(100vw - 20px);right:-10px}
  .search-page{padding:16px 14px 40px}
  .result-card{padding:12px 14px}
}
@media (max-width: 480px) {
  .search-page { padding: 48px 14px; }
  .search-controls { gap: 8px; }
  .filter-bar { gap: 4px; }
  .filter-chip { font-size: 0.68rem; padding: 4px 10px; min-height: 36px; }
  .result-card { padding: 14px 16px; }
  .rc-excerpt { font-size: 0.88rem; }
}
</style>

<body>

<div id="site-nav"></div>

<!-- ===== SEARCH RESULTS PAGE ===== -->
<main class="search-page">
  <div class="search-header" id="searchHeader">
    <h1>Search Results</h1>
    <div class="search-page-input-wrap" id="searchPageInputWrap">
      <label for="searchPageInput" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Search the letters</label>
      <input type="search" id="searchPageInput" class="search-page-input" placeholder="Search 273 letters..." autocomplete="off">
    </div>
    <div class="result-count" id="resultCount"></div>
  </div>

  <div class="search-controls" id="searchControls" style="display:none">
    <label style="font-size:0.78rem;color:var(--ink-2)">Sort:</label>
    <select class="sort-select" id="sortSelect">
      <option value="relevance">Relevance</option>
      <option value="date">Date (Chronological)</option>
      <option value="date-desc">Date (Newest First)</option>
      <option value="author">Author</option>
    </select>
  </div>

  <div class="filter-bar" id="filterBar" style="display:none">
    <!-- Author chips -->
    <button class="filter-chip author-chip" data-author="henry"><span class="chip-dot" style="background:#2D5F8A"></span>Henry</button>
    <button class="filter-chip author-chip" data-author="alexander"><span class="chip-dot" style="background:#B8860B"></span>Alexander</button>
    <button class="filter-chip author-chip" data-author="james"><span class="chip-dot" style="background:#4A7C59"></span>James</button>
    <button class="filter-chip author-chip" data-author="charles"><span class="chip-dot" style="background:#8B3A3A"></span>Charles</button>
    <button class="filter-chip author-chip" data-author="mother"><span class="chip-dot" style="background:#7B5EA7"></span>Mother</button>
    <div class="filter-sep"></div>
    <!-- Flag chips -->
    <button class="filter-chip flag-chip" data-flag="bat">Battle</button>
    <button class="filter-chip flag-chip" data-flag="ill">Illness</button>
    <button class="filter-chip flag-chip" data-flag="dth">Death</button>
    <button class="filter-chip flag-chip" data-flag="wnd">Wound</button>
    <div class="filter-sep"></div>
    <!-- Significance chips -->
    <button class="filter-chip sig-chip" data-sig="major">Major</button>
    <button class="filter-chip sig-chip" data-sig="notable">Notable</button>
  </div>

  <div id="resultsList" class="results-list"></div>
  <button id="loadMore" class="load-more" style="display:none">Load more results</button>
</main>

<!-- ===== DATA + ENGINE ===== -->
<script src="_design-data.js"></script>
<script src="_design-ui.js"></script>
<script src="_search-data.js"></script>
<script src="_letter-nav.js"></script>
<script src="_reader.js"></script>
<script src="_search-engine.js"></script>
<script>
/* ===== STATE ===== */
var allResults = [];
var filteredResults = [];
var displayCount = 20;
var currentQuery = '';
var currentTerms = [];

// Filters
var activeAuthors = [];    // OR logic
var activeFlags = [];      // AND logic
var activeSig = [];        // OR logic
var currentSort = 'relevance';

/* ===== SEARCH INPUT + DROPDOWN PREVIEW ===== */
var searchInput, searchDropdown, ddTimeout = null;

/* Wait for DOMContentLoaded so renderNav() has created #searchInput */
document.addEventListener('DOMContentLoaded', function() {
  searchInput = document.getElementById('searchInput');
  searchDropdown = document.getElementById('searchDropdown');
  var pageInput = document.getElementById('searchPageInput');

  if (searchInput) {
    searchInput.addEventListener('input', function() {
      clearTimeout(ddTimeout);
      var q = this.value.trim();
      if (q.length < 2) { searchDropdown.classList.remove('open'); return; }
      ddTimeout = setTimeout(function() { renderDropdown(q); }, 150);
    });

    searchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && this.value.trim()) {
        e.preventDefault();
        searchDropdown.classList.remove('open');
        var q = this.value.trim();
        if (pageInput) pageInput.value = q;
        runSearch(q);
        if (window.HubbellDeepLink) _searchSyncUrl({ replace: true });
      }
    });

    searchInput.addEventListener('focus', function() {
      if (this.value.trim().length >= 2) renderDropdown(this.value.trim());
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.search-wrap')) searchDropdown.classList.remove('open');
    });
  }

  /* ===== Page-level search input ===== */
  if (pageInput) {
    pageInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && this.value.trim()) {
        e.preventDefault();
        var q = this.value.trim();
        if (searchInput) searchInput.value = q;
        runSearch(q);
        if (window.HubbellDeepLink) _searchSyncUrl({ replace: true });
      }
    });
  }

  /* ===== INIT: Read ?q= ===== */
  var urlQ = new URLSearchParams(window.location.search).get('q');
  if (urlQ) {
    if (searchInput) searchInput.value = urlQ;
    if (pageInput) pageInput.value = urlQ;
    runSearch(urlQ);
  }
});

function renderDropdown(query) {
  var ddResults = search(query, { maxResults: 40 }).filter(function(r) { return r.score >= 8; });
  if (ddResults.length === 0) {
    searchDropdown.innerHTML = '<div class="search-empty">No results for &ldquo;' + esc(query) + '&rdquo;</div>';
    searchDropdown.classList.add('open');
    return;
  }
  var terms = query.toLowerCase().split(/\s+/).filter(function(t) { return t.length > 1; });

  // Summary bar
  var authorCounts = {};
  ddResults.forEach(function(r) { authorCounts[r.letter.a] = (authorCounts[r.letter.a] || 0) + 1; });
  var html = '<div class="search-summary"><span>' + ddResults.length + ' result' + (ddResults.length !== 1 ? 's' : '') + '</span>';
  for (var a in authorCounts) {
    var color = AUTHOR_COLORS[a] || '#999';
    html += '<span class="author-count"><span class="dot" style="background:' + color + '"></span>' + (AUTHOR_NAMES[a] || a) + ': ' + authorCounts[a] + '</span>';
  }
  html += '</div>';

  // Group by match type
  var groups = {meta: [], person: [], place: [], text: []};
  ddResults.forEach(function(r) {
    if (r.matchTypes.indexOf('meta') !== -1) groups.meta.push(r);
    else if (r.matchTypes.indexOf('person') !== -1) groups.person.push(r);
    else if (r.matchTypes.indexOf('place') !== -1) groups.place.push(r);
    else groups.text.push(r);
  });
  var groupLabels = {meta: 'Metadata Matches', person: 'People Mentioned', place: 'Places Referenced', text: 'Letter Content'};
  ['meta', 'person', 'place', 'text'].forEach(function(gk) {
    var items = groups[gk];
    if (items.length === 0) return;
    html += '<div class="search-group" data-gk="' + gk + '"><div class="search-group-label">' + groupLabels[gk] + ' (' + items.length + ')</div>';
    html += '<div class="sg-items">';
    items.forEach(function(r, idx) {
      var l = r.letter;
      var color = AUTHOR_COLORS[l.a] || '#999';
      var excerpt = findBestExcerpt(l.t, terms, 100);
      var highlighted = highlightTerms(excerpt, terms, 220);
      var badges = '';
      r.matchTypes.forEach(function(mt) { badges += '<span class="sr-badge ' + mt + '">' + mt + '</span>'; });
      if (l.bat) badges += '<span class="sr-badge" style="background:#FCE4EC;color:#C62828">battle</span>';
      if (l.ill) badges += '<span class="sr-badge" style="background:#FFF3E0;color:#E65100">illness</span>';
      var hidden = idx >= 8 ? ' style="display:none" data-hidden="1"' : '';
      html += '<div class="search-result" data-lid="' + l.id + '"' + hidden + '>' +
        '<div class="sr-dot" style="background:' + color + '"></div>' +
        '<div class="sr-body">' +
          '<div class="sr-meta"><strong>' + esc(l.an) + '</strong> to ' + esc(l.r) + ' &mdash; ' + esc(l.d) + ', ' + esc(l.loc) + '</div>' +
          '<div class="sr-excerpt">' + highlighted + '</div>' +
          '<div class="sr-badges">' + badges + '</div>' +
        '</div></div>';
    });
    html += '</div>';
    if (items.length > 8) {
      html += '<button class="sg-expand" data-group="' + gk + '" data-shown="8" style="display:block;width:100%;padding:6px 16px;font-size:0.72rem;color:var(--ink-3);text-align:center;background:none;border:none;cursor:pointer;font-family:Inter,sans-serif">+ ' + (items.length - 8) + ' more &darr;</button>';
    }
    html += '</div>';
  });

  // Footer link — press Enter or click to run full-page search
  html += '<a href="#" class="dd-view-all" style="display:block;padding:10px 16px;font-size:0.78rem;color:#2D5F8A;text-align:center;text-decoration:none;border-top:1px solid var(--rule-2);font-weight:500">View all ' + ddResults.length + ' results &rarr;</a>';

  searchDropdown.innerHTML = html;
  searchDropdown.classList.add('open');

  // Wire up result clicks + hover → open reader
  searchDropdown.querySelectorAll('.search-result').forEach(function(el) {
    el.addEventListener('mouseenter', function(e) { showSearchTooltip(e, this.dataset.lid); });
    el.addEventListener('mousemove', function(e) { moveSearchTooltip(e); });
    el.addEventListener('mouseleave', hideSearchTooltip);
    el.addEventListener('click', function() {
      hideSearchTooltip();
      var lid = this.dataset.lid;
      var letter = LETTERS.find(function(l) { return l.id === lid; });
      if (letter) openReader(letter, terms);
      searchDropdown.classList.remove('open');
    });
  });

  // Wire up expand buttons
  searchDropdown.querySelectorAll('.sg-expand').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var group = this.closest('.search-group');
      var hiddenEls = group.querySelectorAll('.search-result[data-hidden="1"]');
      var count = 0;
      hiddenEls.forEach(function(el) { if (count < 8) { el.style.display = ''; el.removeAttribute('data-hidden'); count++; } });
      this.dataset.shown = +this.dataset.shown + count;
      var remaining = group.querySelectorAll('.search-result[data-hidden="1"]').length;
      if (remaining > 0) { this.textContent = '+ ' + remaining + ' more \u2193'; }
      else { this.style.display = 'none'; }
    });
  });

  // Wire up "View all" footer → run full-page search
  var viewAll = searchDropdown.querySelector('.dd-view-all');
  if (viewAll) {
    viewAll.addEventListener('click', function(e) {
      e.preventDefault();
      searchDropdown.classList.remove('open');
      runSearch(query);
      if (window.HubbellDeepLink) _searchSyncUrl({ replace: true });
    });
  }
}

/* ===== RUN SEARCH ===== */
function runSearch(query) {
  currentQuery = query;
  currentTerms = query.toLowerCase().split(/\s+/).filter(function(t) { return t.length > 1; });
  allResults = search(query).filter(function(r) { return r.score >= 8; });
  displayCount = 20;

  // Reset filters
  activeAuthors = [];
  activeFlags = [];
  activeSig = [];
  document.querySelectorAll('.filter-chip.active').forEach(function(c) { c.classList.remove('active'); });

  applyFiltersAndRender();

  // Show controls
  document.getElementById('searchControls').style.display = allResults.length > 0 ? 'flex' : 'none';
  document.getElementById('filterBar').style.display = allResults.length > 0 ? 'flex' : 'none';
}

/* ===== FILTER + SORT + RENDER ===== */
function applyFiltersAndRender() {
  // Filter
  filteredResults = allResults.filter(function(r) {
    // Author: OR logic (if any active, letter must match one)
    if (activeAuthors.length > 0 && activeAuthors.indexOf(r.letter.a) === -1) return false;
    // Flags: AND logic (all active flags must be true)
    for (var i = 0; i < activeFlags.length; i++) {
      if (!r.letter[activeFlags[i]]) return false;
    }
    // Significance: OR logic
    if (activeSig.length > 0 && activeSig.indexOf(r.letter.sig) === -1) return false;
    return true;
  });

  // Sort
  if (currentSort === 'date') {
    filteredResults.sort(function(a, b) { return a.letter.d.localeCompare(b.letter.d); });
  } else if (currentSort === 'date-desc') {
    filteredResults.sort(function(a, b) { return b.letter.d.localeCompare(a.letter.d); });
  } else if (currentSort === 'author') {
    filteredResults.sort(function(a, b) {
      var cmp = a.letter.a.localeCompare(b.letter.a);
      return cmp !== 0 ? cmp : a.letter.d.localeCompare(b.letter.d);
    });
  }
  // 'relevance' keeps the original score order

  renderResults();
}

function renderResults() {
  var countEl = document.getElementById('resultCount');
  var listEl = document.getElementById('resultsList');
  var loadMoreBtn = document.getElementById('loadMore');

  if (allResults.length === 0) {
    countEl.textContent = '';
    listEl.innerHTML = '<div class="search-empty"><h2>No results found</h2><p>Try different keywords, a date like &ldquo;1862&rdquo;, or an author name.</p></div>';
    loadMoreBtn.style.display = 'none';
    return;
  }

  var showing = filteredResults.length;
  var total = allResults.length;
  var filterNote = showing < total ? ' (filtered from ' + total + ')' : '';
  countEl.innerHTML = '<strong>' + showing + '</strong> result' + (showing !== 1 ? 's' : '') + ' for &ldquo;' + esc(currentQuery) + '&rdquo;' + filterNote;

  var html = '';
  var limit = Math.min(displayCount, filteredResults.length);
  for (var i = 0; i < limit; i++) {
    var r = filteredResults[i];
    var l = r.letter;
    var color = AUTHOR_COLORS[l.a] || '#999';
    var name = AUTHOR_NAMES[l.a] || l.an;
    var excerpt = findBestExcerpt(l.t, currentTerms, 150);
    var highlighted = highlightTerms(excerpt, currentTerms, 350);

    // Badges
    var badges = '';
    r.matchTypes.forEach(function(mt) {
      badges += '<span class="rc-badge ' + mt + '">' + mt + '</span>';
    });
    if (l.bat) badges += '<span class="rc-badge battle">battle</span>';
    if (l.ill) badges += '<span class="rc-badge illness">illness</span>';
    if (l.dth) badges += '<span class="rc-badge death">death</span>';
    if (l.wnd) badges += '<span class="rc-badge wound">wound</span>';

    // Significance star
    var sigStar = l.sig === 'major' ? '<span class="rc-sig" title="Major significance">&#9733;</span>' : '';

    // People (first 3)
    var peopleStr = '';
    if (l.ppl && l.ppl.length > 0) {
      var shown = l.ppl.slice(0, 3).join(', ');
      if (l.ppl.length > 3) shown += ' +' + (l.ppl.length - 3);
      peopleStr = '<span class="rc-people">' + esc(shown) + '</span>';
    }

    html += '<div class="result-card" data-lid="' + l.id + '">' +
      '<div class="rc-dot" style="background:' + color + '"></div>' +
      '<div class="rc-body">' +
        '<div class="rc-top">' +
          '<span class="rc-author" style="color:' + color + '">' + esc(name) + '</span>' + sigStar +
          '<span class="rc-date">' + esc(l.d) + '</span>' +
          '<span class="rc-location">' + esc(l.loc) + '</span>' +
        '</div>' +
        '<div class="rc-recipient">To ' + esc(l.r) + '</div>' +
        '<div class="rc-excerpt">' + highlighted + '</div>' +
        '<div class="rc-footer">' + badges +
          '<a class="rc-map-link" href="viz-map-fullwar?date=' + encodeURIComponent(l.d) + '&brother=' + encodeURIComponent(l.a) + '&letter=' + encodeURIComponent(l.id) + '" title="View on map" onclick="event.stopPropagation()">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>' +
            ' Map' +
          '</a>' +
          peopleStr + '</div>' +
      '</div></div>';
  }

  listEl.innerHTML = html;
  loadMoreBtn.style.display = limit < filteredResults.length ? 'block' : 'none';
  loadMoreBtn.textContent = 'Load more (' + (filteredResults.length - limit) + ' remaining)';

  // Wire up clicks + hover tooltips
  listEl.querySelectorAll('.result-card').forEach(function(el) {
    el.addEventListener('click', function() {
      var lid = this.dataset.lid;
      var letter = LETTERS.find(function(l) { return l.id === lid; });
      if (letter) openReader(letter, currentTerms);
    });
    el.addEventListener('mouseenter', function(e) { showSearchTooltip(e, this.dataset.lid); });
    el.addEventListener('mousemove', function(e) { moveSearchTooltip(e); });
    el.addEventListener('mouseleave', hideSearchTooltip);
  });
}

/* ===== SEARCH HOVER TOOLTIP ===== */
var searchTooltipEl = null;
function ensureSearchTooltip() {
  if (searchTooltipEl) return;
  searchTooltipEl = document.createElement('div');
  searchTooltipEl.className = 'search-tooltip';
  document.body.appendChild(searchTooltipEl);
}

var _searchIsTouch = false;
window.addEventListener('touchstart', function() { _searchIsTouch = true; }, { once: true });

function showSearchTooltip(e, lid) {
  if (_searchIsTouch) return;
  var letter = LETTERS.find(function(l) { return l.id === lid; });
  if (!letter || !letter.ss) return;
  ensureSearchTooltip();

  var color = AUTHOR_COLORS[letter.a] || '#999';
  var name = AUTHOR_NAMES[letter.a] || letter.an || letter.a;

  // Truncate summary to ~2 sentences
  var summary = letter.ss.replace(/\*\*/g, '');
  var sentences = summary.match(/[^.!?]+[.!?]+/g);
  if (sentences && sentences.length > 2) summary = sentences.slice(0, 2).join('').trim();
  if (summary.length > 200) summary = summary.slice(0, 197) + '...';

  var tags = '';
  if (letter.bat) tags += '<span class="stt-tag stt-battle">Battle</span>';
  if (letter.ill) tags += '<span class="stt-tag stt-illness">Illness</span>';
  if (letter.dth) tags += '<span class="stt-tag stt-death">Death</span>';
  if (letter.wnd) tags += '<span class="stt-tag stt-wound">Wound</span>';

  searchTooltipEl.innerHTML =
    '<div class="stt-author" style="color:' + color + '">' + esc(name) + ' \u2192 ' + esc(letter.r) + '</div>' +
    '<div class="stt-date">' + esc(letter.d) + ' \u00b7 ' + esc(letter.loc) + '</div>' +
    '<div class="stt-summary">' + esc(summary) + '</div>' +
    (tags ? '<div class="stt-tags">' + tags + '</div>' : '');

  moveSearchTooltip(e);
  searchTooltipEl.classList.add('visible');
}

function moveSearchTooltip(e) {
  if (!searchTooltipEl) return;
  var x = e.clientX + 16;
  var y = e.clientY - 10;
  // Keep within viewport
  var rect = searchTooltipEl.getBoundingClientRect();
  if (x + rect.width > window.innerWidth - 12) x = e.clientX - rect.width - 12;
  if (y + rect.height > window.innerHeight - 12) y = e.clientY - rect.height - 8;
  if (y < 8) y = 8;
  searchTooltipEl.style.left = x + 'px';
  searchTooltipEl.style.top = y + 'px';
}

function hideSearchTooltip() {
  if (searchTooltipEl) searchTooltipEl.classList.remove('visible');
}
document.addEventListener('touchstart', hideSearchTooltip);

/* ===== LOAD MORE ===== */
document.getElementById('loadMore').addEventListener('click', function() {
  displayCount += 20;
  renderResults();
});

/* ===== SORT ===== */
document.getElementById('sortSelect').addEventListener('change', function() {
  currentSort = this.value;
  displayCount = 20;
  applyFiltersAndRender();
});

/* ===== FILTER CHIPS ===== */
document.querySelectorAll('.author-chip').forEach(function(chip) {
  chip.addEventListener('click', function() {
    var author = this.dataset.author;
    this.classList.toggle('active');
    if (this.classList.contains('active')) {
      if (activeAuthors.indexOf(author) === -1) activeAuthors.push(author);
    } else {
      activeAuthors = activeAuthors.filter(function(a) { return a !== author; });
    }
    displayCount = 20;
    applyFiltersAndRender();
  });
});

document.querySelectorAll('.flag-chip').forEach(function(chip) {
  chip.addEventListener('click', function() {
    var flag = this.dataset.flag;
    this.classList.toggle('active');
    if (this.classList.contains('active')) {
      if (activeFlags.indexOf(flag) === -1) activeFlags.push(flag);
    } else {
      activeFlags = activeFlags.filter(function(f) { return f !== flag; });
    }
    displayCount = 20;
    applyFiltersAndRender();
  });
});

document.querySelectorAll('.sig-chip').forEach(function(chip) {
  chip.addEventListener('click', function() {
    var sig = this.dataset.sig;
    this.classList.toggle('active');
    if (this.classList.contains('active')) {
      if (activeSig.indexOf(sig) === -1) activeSig.push(sig);
    } else {
      activeSig = activeSig.filter(function(s) { return s !== sig; });
    }
    displayCount = 20;
    applyFiltersAndRender();
  });
});

/* ===== LETTER READER ===== */
function openReader(letter, terms) {
  HubbellReader.open(letter.id, { highlight: terms });
}

function closeReader() {
  HubbellReader.close();
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (HubbellReader.isOpen()) HubbellReader.close();
    else if (searchDropdown.classList.contains('open')) { searchDropdown.classList.remove('open'); searchInput.blur(); }
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  }
});
</script>
<script src="_deeplink.js"></script>
<script>
HubbellDeepLink.injectShareButton();

function _searchSyncUrl(opts) {
  var state = {};
  if (currentQuery) state.q = currentQuery;
  if (activeAuthors.length) state.author = activeAuthors.join(',');
  if (activeFlags.length) state.flag = activeFlags.join(',');
  if (activeSig.length) state.sig = activeSig.join(',');
  if (currentSort !== 'relevance') state.sort = currentSort;
  if (HubbellReader.isOpen()) {
    state.letter = HubbellReader.getCurrentLetterId();
  }
  HubbellDeepLink.update(state, opts || { replace: true });
}

HubbellDeepLink.registerStateReader(function() {
  var state = {};
  if (currentQuery) state.q = currentQuery;
  if (activeAuthors.length) state.author = activeAuthors.join(',');
  if (activeFlags.length) state.flag = activeFlags.join(',');
  if (activeSig.length) state.sig = activeSig.join(',');
  if (currentSort !== 'relevance') state.sort = currentSort;
  if (HubbellReader.isOpen()) {
    state.letter = HubbellReader.getCurrentLetterId();
  }
  return state;
});

HubbellDeepLink.registerStateApplier(function(p) {
  // Query
  if (p.q) {
    document.getElementById('searchInput').value = p.q;
    runSearch(p.q);
  }
  // Filters
  if (p.author) {
    p.author.split(',').forEach(function(a) {
      var chip = document.querySelector('.author-chip[data-author="' + a + '"]');
      if (chip && !chip.classList.contains('active')) chip.click();
    });
  }
  if (p.flag) {
    p.flag.split(',').forEach(function(f) {
      var chip = document.querySelector('.flag-chip[data-flag="' + f + '"]');
      if (chip && !chip.classList.contains('active')) chip.click();
    });
  }
  if (p.sig) {
    p.sig.split(',').forEach(function(s) {
      var chip = document.querySelector('.sig-chip[data-sig="' + s + '"]');
      if (chip && !chip.classList.contains('active')) chip.click();
    });
  }
  if (p.sort) {
    var sel = document.getElementById('sortSelect');
    if (sel) { sel.value = p.sort; sel.dispatchEvent(new Event('change')); }
  }
  // Letter
  if (p.letter) {
    var letter = LETTERS.find(function(l) { return l.id === p.letter; });
    if (letter) setTimeout(function() { openReader(letter, currentTerms); }, 200);
  }
});

HubbellDeepLink.enableHistory();

// Override existing init — remove old ?q= handler since deep-link handles it
// The IIFE at line 243 already ran, so we just need applier for filters
var dlParams = HubbellDeepLink.read();
if (dlParams.author || dlParams.flag || dlParams.sig || dlParams.sort || dlParams.letter) {
  HubbellDeepLink.applyOnLoad();
}

// Hook open/close reader to sync URL
var _origSearchOpenReader = openReader;
openReader = function(letter, terms) {
  _origSearchOpenReader(letter, terms);
  _searchSyncUrl();
};
var _origSearchCloseReader = closeReader;
closeReader = function() {
  _origSearchCloseReader();
  _searchSyncUrl();
};
</script>
