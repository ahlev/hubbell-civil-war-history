<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Four Brothers — frameless composite (proxy)</title>
<style>
/* Frameless 4-up: the four chosen brother stills blended edge-to-edge into ONE painted
   polyptych (no visible frames). Full-bleed 16:9 — a clean screenshot at 1920×1080 is the
   rain-wash end_image proxy. Pure visual: NO text (text lives as a later code overlay). */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#0b0a08;overflow:hidden}
.composite{position:relative;width:100vw;height:100vh;display:flex;background:#0b0a08}
.panel{flex:1 1 25%;height:100%;background-size:cover;background-repeat:no-repeat;
  /* shared grade so four different lights read as one canvas */
  filter:saturate(.82) contrast(1.03) brightness(.99) sepia(.06)}
.p-alex   {background-image:url('assets/brothers/web/window-alexander-fav.webp');background-position:55% 36%}
.p-henry  {background-image:url('assets/brothers/web/window-henry-v1.webp');   background-position:50% 34%}
.p-james  {background-image:url('assets/brothers/web/window-james-v2-wide.webp');background-position:50% 42%}
.p-charles{background-image:url('assets/brothers/web/window-charles-v1.webp');  background-position:54% 34%}

/* soft shadow "folds" at the three internal seams so the cuts read as a polyptych join, not a hard edge */
.seam{position:absolute;top:0;bottom:0;width:7%;transform:translateX(-50%);pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(8,7,5,.55),transparent)}
.seam.s1{left:25%}.seam.s2{left:50%}.seam.s3{left:75%}

/* global unifying overlays */
.grade{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 42%, transparent 52%, rgba(8,7,5,.62) 100%)}     /* vignette */
.grain{position:absolute;inset:0;pointer-events:none;opacity:.08;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
.warmcool{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.5;
  background:linear-gradient(90deg, rgba(224,176,112,.5), rgba(120,140,170,.0) 45%, rgba(120,140,170,.0) 60%, rgba(150,170,200,.45))}
</style>
</head>
<body>
<div class="composite">
  <div class="panel p-alex"></div>
  <div class="panel p-henry"></div>
  <div class="panel p-james"></div>
  <div class="panel p-charles"></div>
  <div class="seam s1"></div><div class="seam s2"></div><div class="seam s3"></div>
  <div class="warmcool"></div>
  <div class="grain"></div>
  <div class="grade"></div>
</div>
</body>
</html>
