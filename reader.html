<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Letter — The Hubbell Brothers</title>
<link rel="icon" href="/logo.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<!-- The dashboard reader styles live ONLY in this document. Because reader.html is loaded inside an
     iframe on the landing, none of these global rules can reach the immersive landing page. -->
<link rel="stylesheet" href="/_design.css"/>
<link rel="stylesheet" href="/_overlay.css"/>
<style>
  /* transparent so the landing shows (dimmed by the reader's own backdrop) behind the panel */
  html,body{margin:0;background:transparent}
</style>
</head>
<body>
<script src="/_design-data.js"></script>
<script src="/_design-ui.js"></script>
<script src="/_deeplink.js"></script>
<script src="/_overlay-data.js"></script>
<script src="/_letter-nav.js"></script>
<script src="/_overlay.js"></script>
<script src="/_reader.js"></script>
<script>
(function(){
  var closed=false;
  function getId(){ try{ return new URLSearchParams(location.search).get('id'); }catch(e){ return null; } }
  function notifyClose(){ if(closed) return; closed=true; try{ parent.postMessage('hubbell-reader-close','*'); }catch(e){} }
  function start(){
    var id=getId();
    if(!id || !window.HubbellOverlay || typeof HubbellOverlay.showLetter!=='function'){ notifyClose(); return; }
    // Mechanism 1 (instant): wrap the close API so the ✕ button / programmatic close tell the parent right away.
    ['close','_close'].forEach(function(k){
      if(typeof HubbellOverlay[k]==='function'){
        var orig=HubbellOverlay[k];
        HubbellOverlay[k]=function(){ try{ orig.apply(this,arguments); }catch(e){} notifyClose(); };
      }
    });
    HubbellOverlay.showLetter(id);
    // Mechanism 2 (timing-independent safety net): poll the panel's 'visible' state. closeOverlay() only
    // toggles that class (backdrop-click & Esc go straight to it, bypassing the wrapped API), so once the
    // panel has BEEN visible and then isn't, the reader is closed → notify the parent. Catches every path.
    var wasVisible=false;
    var poll=setInterval(function(){
      var panel=document.querySelector('.hubbell-overlay-panel');
      var vis=panel && panel.classList.contains('visible');
      if(vis){ wasVisible=true; }
      else if(wasVisible || closed){ clearInterval(poll); notifyClose(); }
    },200);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ setTimeout(start,60); });
  else setTimeout(start,60);
})();
</script>
</body>
</html>
