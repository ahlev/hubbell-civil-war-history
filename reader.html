<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Letter — The Hubbell Brothers</title>
<link rel="icon" href="/logo.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<!-- The dashboard reader styles live ONLY in this document. Because reader.html is loaded inside an
     iframe on the landing, none of these global rules can reach the immersive landing page. -->
<link rel="stylesheet" href="/_design.css"/>
<link rel="stylesheet" href="/_overlay.css"/>
<!-- era theme — loaded LAST so it retones/overrides the dashboard reader styling, scoped to this iframe only -->
<link rel="stylesheet" href="/_reader-era.css?v=10"/>
<style>
  /* transparent so the landing shows (dimmed by the reader's own backdrop) behind the panel */
  html,body{margin:0;background:transparent}
</style>
</head>
<body>
<script src="/_design-data.js"></script>
<script src="/_design-ui.js"></script>
<script src="/_deeplink.js"></script>
<script src="/_overlay-data.js"></script>
<!-- full LETTERS array (transcriptions + flags + people/places) so the FULL reader (HubbellReader.open)
     renders the key-event toggles, synopsis, and people/places apparatus -->
<script src="/_search-data.js"></script>
<script src="/_letter-nav.js"></script>
<script src="/_overlay.js"></script>
<script src="/_reader.js"></script>
<script>
(function(){
  var closed=false;
  function getId(){ try{ return new URLSearchParams(location.search).get('id'); }catch(e){ return null; } }
  function notifyClose(){ if(closed) return; closed=true; try{ parent.postMessage('hubbell-reader-close','*'); }catch(e){} }
  function start(){
    var id=getId();
    // Use the FULL reader (HubbellReader.open) — same as the Preservation page — so the landing reader
    // carries the key-event toggle pills, the synopsis, and the people/places apparatus.
    if(!id || !window.HubbellReader || typeof HubbellReader.open!=='function'){ notifyClose(); return; }
    // wrap close so the ✕ / programmatic close notify the parent instantly
    if(typeof HubbellReader.close==='function'){
      var orig=HubbellReader.close;
      HubbellReader.close=function(){ try{ orig.apply(this,arguments); }catch(e){} notifyClose(); };
    }
    HubbellReader.open(id);
    // timing-independent safety net: once the reader HAS been open and then closes (X / backdrop / Esc),
    // tell the parent to tear down the iframe overlay.
    var wasOpen=false;
    var poll=setInterval(function(){
      var open = (typeof HubbellReader.isOpen==='function') ? HubbellReader.isOpen() : !!document.querySelector('.reader-overlay.open');
      if(open){ wasOpen=true; }
      else if(wasOpen || closed){ clearInterval(poll); notifyClose(); }
    },200);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ setTimeout(start,60); });
  else setTimeout(start,60);
})();
</script>
</body>
</html>
