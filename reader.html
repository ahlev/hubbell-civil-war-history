<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Letter â€” The Hubbell Brothers</title>
<link rel="icon" href="/logo.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>

<!-- The dashboard reader styles live ONLY in this document. Because reader.html is loaded inside an
     iframe on the landing, none of these global rules can reach the immersive landing page. -->
<link rel="stylesheet" href="/_design.css?v=12"/>
<link rel="stylesheet" href="/_overlay.css?v=13"/>
<!-- era theme â€” loaded LAST so it retones/overrides the dashboard reader styling, scoped to this iframe only -->
<link rel="stylesheet" href="/_reader-era.css?v=19"/>
<style>
  /* transparent so the landing shows (dimmed by the reader's own backdrop) behind the panel */
  html,body{margin:0;background:transparent}
</style>
</head>
<body>
<script src="/_design-data.js"></script>
<script src="/_design-ui.js?v=14"></script>
<script src="/_deeplink.js"></script>
<script src="/_overlay-data.js?v=17"></script>
<!-- full LETTERS array (transcriptions + flags + people/places) so the FULL reader (HubbellReader.open)
     renders the key-event toggles, synopsis, and people/places apparatus -->
<script src="/_search-data.js"></script>
<script src="/_letter-nav.js"></script>
<script src="/_overlay.js?v=29"></script>
<!-- ?v bumped with _reader-era.css so a fresh reader.html (rv-busted) also pulls the matching
     _reader.js?v=25 â€” keeps the inline --pc seal-dot hook in sync with the era CSS that reads it -->
<script src="/_reader.js?v=25"></script>
<script>
(function(){
  var closed=false;
  function getId(){ try{ return new URLSearchParams(location.search).get('id'); }catch(e){ return null; } }
  function notifyClose(){ if(closed) return; closed=true; try{ parent.postMessage('hubbell-reader-close','*'); }catch(e){} }
  function start(){
    var id=getId();
    // Use the FULL reader (HubbellReader.open) â€” same as the Preservation page â€” so the landing reader
    // carries the key-event toggle pills, the synopsis, and the people/places apparatus.
    if(!id || !window.HubbellReader || typeof HubbellReader.open!=='function'){ notifyClose(); return; }
    // wrap close so the âœ• / programmatic close notify the parent instantly
    if(typeof HubbellReader.close==='function'){
      var orig=HubbellReader.close;
      HubbellReader.close=function(){ try{ orig.apply(this,arguments); }catch(e){} notifyClose(); };
    }
    HubbellReader.open(id);
    setTimeout(mountScrollRail, 140);   // visible draggable scrollbar on mobile (after the content renders)
    // timing-independent safety net: once the reader HAS been open and then closes (X / backdrop / Esc),
    // tell the parent to tear down the iframe overlay.
    var wasOpen=false;
    var poll=setInterval(function(){
      var open = (typeof HubbellReader.isOpen==='function') ? HubbellReader.isOpen() : !!document.querySelector('.reader-overlay.open');
      if(open){ wasOpen=true; }
      else if(wasOpen || closed){ clearInterval(poll); notifyClose(); }
    },200);
  }
  // â”€â”€ Mobile scroll rail: a visible, draggable scrollbar for the letter region.
  //    Scoped to this landing iframe only (not the shared reader). Sized to the
  //    #hubbellReaderContent scroll viewport so it spans exactly the letter â€” clearing
  //    the header above and the footer/advance buttons below. CSS hides it â‰¥641px.
  function mountScrollRail(){
    var panel = document.querySelector('.reader-panel');
    var content = document.getElementById('hubbellReaderContent');
    if(!panel || !content || panel.querySelector('.era-scrollrail')) return;
    var rail = document.createElement('div'); rail.className = 'era-scrollrail';
    var thumb = document.createElement('div'); thumb.className = 'era-scrollthumb';
    rail.appendChild(thumb); panel.appendChild(rail);

    function metrics(){
      var ch = content.clientHeight, sh = content.scrollHeight;
      var railH = ch, thumbH = Math.max(30, railH * (ch / sh));
      return { ch:ch, sh:sh, overflow: sh - ch, railH:railH, thumbH:thumbH, maxThumbTop: railH - thumbH };
    }
    function update(){
      var m = metrics();
      if(m.overflow <= 4){ rail.style.display = 'none'; return; }
      rail.style.display = 'block';
      rail.style.top = content.offsetTop + 'px';   // align to the scroll viewport within the panel
      rail.style.height = m.ch + 'px';
      var top = m.overflow > 0 ? (content.scrollTop / m.overflow) * m.maxThumbTop : 0;
      thumb.style.height = m.thumbH + 'px';
      thumb.style.transform = 'translateY(' + top + 'px)';
    }
    content.addEventListener('scroll', update, { passive:true });
    if(window.ResizeObserver){ try{ new ResizeObserver(update).observe(content); }catch(e){} }
    window.addEventListener('resize', update);

    var dragging = false, startY = 0, startScroll = 0;
    thumb.addEventListener('pointerdown', function(e){
      dragging = true; startY = e.clientY; startScroll = content.scrollTop;
      try{ thumb.setPointerCapture(e.pointerId); }catch(_){}
      e.preventDefault(); e.stopPropagation();
    });
    thumb.addEventListener('pointermove', function(e){
      if(!dragging) return;
      var m = metrics();
      var dScroll = m.maxThumbTop > 0 ? ((e.clientY - startY) / m.maxThumbTop) * m.overflow : 0;
      content.scrollTop = startScroll + dScroll;
    });
    function endDrag(e){ dragging = false; try{ thumb.releasePointerCapture(e.pointerId); }catch(_){} }
    thumb.addEventListener('pointerup', endDrag);
    thumb.addEventListener('pointercancel', endDrag);

    update();
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ setTimeout(start,60); });
  else setTimeout(start,60);
})();
</script>
</body>
</html>
